<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Спасибо за ответ — Амина</title>
<style>
  :root { --green: #2E7D32; --bg: #f4f7f4; --text: #222; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121512; --text: #e8ece8; --card: #1d221d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); font: 17px/1.55 Arial, Helvetica, sans-serif; padding: 16px; }
  .card { max-width: 520px; width: 100%; background: var(--card); border-radius: 14px; overflow: hidden;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .top { background: var(--green); color: #fff; padding: 18px 24px; font-weight: bold; font-size: 19px; }
  .body { padding: 28px 24px 32px; }
  .ok { width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  a.btn { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 8px;
          background: var(--green); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="top">Амина — горшки, кашпо, кассеты</div>
  <div class="body">
    <div class="ok">✓</div>
    <h1>Спасибо, ответ получен!</h1>
    <p id="txt">Менеджер свяжется с вами.</p>
    <a class="btn" href="https://www.aminaplast.ru">Перейти в каталог</a>
  </div>
</div>
<script>
  var t = {
    mesyac: "Менеджер свяжется с вами в ближайшие дни, уточнит объём и пришлёт актуальный прайс.",
    zima:   "Напомним о себе зимой и заранее подготовим предложение под ваш заказ.",
    vesna:  "Учтём ваш заказ в плане производства на весну 2027, чтобы нужные позиции были в наличии.",
    net:    "Понимаем. Если что-то не устроило в прошлый раз — ответьте на наше письмо, мы разберёмся."
  };
  var k = new URLSearchParams(location.search).get("otvet");
  if (t[k]) document.getElementById("txt").textContent = t[k];
</script>
</body>
</html>
